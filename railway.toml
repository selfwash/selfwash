# Single Railway service: SQS consumer + FastAPI (see docker-entrypoint.sh).
# Generate a public domain for this service — GET /health for healthchecks.
# For production durability use PostgreSQL: set DATABASE_URL (SQLite on Railway disk is ephemeral).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/app/docker-entrypoint.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 50
healthcheckPath = "/health"
healthcheckTimeout = 100

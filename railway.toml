# Single Railway service: SQS consumer + FastAPI (see docker-entrypoint.sh).
# REQUIRED: Add PostgreSQL (New → Database → PostgreSQL), then Variables → Reference DATABASE_URL
# from that database onto this service. SQLite is rejected on Railway (db.py).
# Generate a public domain — GET /health for healthchecks.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/app/docker-entrypoint.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 50
healthcheckPath = "/health"
healthcheckTimeout = 300
